[project]
name = "fastapi-vue-clean-arch-backend"
version = "1.0.0"
description = "Clean Architecture production starter template for FastAPI and Vue 3."
requires-python = ">=3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"app/presentation/*" = ["B008"]
"app/main.py" = ["ARG001"]
"tests/*" = ["ARG"]
